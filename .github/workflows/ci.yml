name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Pytest (offline)
        run: uv run pytest
        env:
          # Never call paid models in CI
          TYPESAFE_API_KEY: ""
          JEV_ALLOW_FAKE_IP: "0"
          CI: "true"

      - name: Validate + render check
        run: |
          uv run jev-awesome validate
          uv run jev-awesome render --check
