name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Pytest (offline)
        run: uv run pytest
        env:
          # Never call paid models in CI
          TYPESAFE_API_KEY: ""
          JEV_ALLOW_FAKE_IP: "0"
          CI: "true"

      - name: Validate + render check
        run: |
          uv run jev-awesome validate
          uv run jev-awesome render --check
