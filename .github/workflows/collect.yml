name: Collect

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no catalog write / no PR)
        type: boolean
        default: true
      mode:
        description: Collect mode
        type: choice
        default: incremental
        options:
          - incremental
          - refresh
          - maintenance
          - all
      classifier:
        description: Classifier mode
        type: choice
        default: rules
        options:
          - rules
          - auto
          - typesafe
  schedule:
    # UTC 00:17, 06:17, 12:17, 18:17 → Asia/Shanghai 08:17/14:17/20:17/02:17
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: collect-catalog
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'fanly/Jev-awesome'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      overall: ${{ steps.run.outputs.overall }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check feature flags
        id: flags
        run: |
          echo "collector=${COLLECTOR_ENABLED:-false}" >> "$GITHUB_OUTPUT"
          echo "auto_pr=${AUTO_PR_ENABLED:-false}" >> "$GITHUB_OUTPUT"
        env:
          COLLECTOR_ENABLED: ${{ vars.COLLECTOR_ENABLED }}
          AUTO_PR_ENABLED: ${{ vars.AUTO_PR_ENABLED }}

      - name: Install uv
        if: steps.flags.outputs.collector == 'true' || github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Sync
        if: steps.flags.outputs.collector == 'true' || github.event_name == 'workflow_dispatch'
        run: uv sync --frozen

      - name: Merge open robot branch data if present
        if: steps.flags.outputs.collector == 'true' || github.event_name == 'workflow_dispatch'
        id: merge
        run: |
          set -euo pipefail
          BRANCH="automation/catalog-update"
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            rm -rf /tmp/robot-branch
            git worktree add /tmp/robot-branch "origin/$BRANCH"
            echo "path=/tmp/robot-branch" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run collect
        id: run
        if: steps.flags.outputs.collector == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          CLASSIFIER: ${{ github.event.inputs.classifier || 'rules' }}
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'true' }}
          MERGE_FROM: ${{ steps.merge.outputs.path }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ -n "${MERGE_FROM}" ]]; then
            EXTRA+=(--merge-from "${MERGE_FROM}")
          fi
          if [[ "${DRY}" == "true" ]]; then
            uv run jev-awesome collect --mode "$MODE" --classifier "$CLASSIFIER" --dry-run --max-pages 2 "${EXTRA[@]}"
          else
            # write-local still does not push; publish job is separate and gated
            uv run jev-awesome collect --mode "$MODE" --classifier "$CLASSIFIER" --write-local --max-pages 2 "${EXTRA[@]}"
            uv run jev-awesome validate
            uv run jev-awesome render
          fi
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path("data/reports/latest.json")
          overall = "unknown"
          if p.exists():
              overall = json.loads(p.read_text())["overall"]
          print(f"overall={overall}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"overall={overall}\n")
          PY

      - name: Upload report artifact
        if: always() && (steps.flags.outputs.collector == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collect-report
          path: data/reports/
          retention-days: 14

  publish-pr:
    needs: collect
    if: >-
      github.repository == 'fanly/Jev-awesome' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.dry_run == 'false' &&
      vars.AUTO_PR_ENABLED == 'true' &&
      needs.collect.outputs.overall != 'failed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download report / note
        run: |
          echo "PR publish is gated. Implementer must verify allowed paths before enabling."
          echo "Default: AUTO_PR_ENABLED=false. Manual enable required after bootstrap."
          # Placeholder intentionally conservative: do not force-push; do not modify workflows.
          exit 0
